name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "rules/**", "engine/**", "scripts/build-engine-for-ios.sh", ".github/workflows/ios.yml"]
  # Every PR, so the "iOS OK" required check always reports. Jobs skip when nothing relevant changed.
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pushes to main are already path-filtered by the trigger.
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(ios/|rules/|engine/|scripts/build-engine-for-ios\.sh$|\.github/workflows/ios\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  rewindcore:
    name: RewindCore tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/Packages/RewindCore
        run: swift test

  build:
    name: Build app (simulator, unsigned)
    needs: [changes, rewindcore]
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Version comes from "packageManager" in engine/package.json.
          package_json_file: engine/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build
        working-directory: ios
        run: |
          xcodebuild build \
            -project SocialRewind.xcodeproj \
            -scheme SocialRewind \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # The required status check. Always runs; passes when every job it needs passed, or was
  # skipped because the PR didn't touch what it tests (docs-only PRs).
  ok:
    name: iOS OK
    needs: [changes, rewindcore, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          check() { case "$2" in success|skipped) echo "$1: $2" ;; *) echo "::error::$1: $2"; exit 1 ;; esac; }
          [ "${{ needs.changes.result }}" = success ] || { echo "::error::change detection failed"; exit 1; }
          check "rewindcore" "${{ needs.rewindcore.result }}"
          check "build" "${{ needs.build.result }}"
