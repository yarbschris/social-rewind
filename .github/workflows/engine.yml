name: engine

on:
  push:
    branches: [main]
    paths: ["engine/**", "rules/**", ".github/workflows/engine.yml"]
  # Every PR, so the "engine OK" required check always reports. Jobs skip when nothing relevant changed.
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pushes to main are already path-filtered by the trigger.
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(engine/|rules/|\.github/workflows/engine\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: engine/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: engine/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate-rules
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The required status check. Always runs; passes when every job it needs passed, or was
  # skipped because the PR didn't touch what it tests (docs-only PRs).
  ok:
    name: engine OK
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          check() { case "$2" in success|skipped) echo "$1: $2" ;; *) echo "::error::$1: $2"; exit 1 ;; esac; }
          [ "${{ needs.changes.result }}" = success ] || { echo "::error::change detection failed"; exit 1; }
          check "test" "${{ needs.test.result }}"
