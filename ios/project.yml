# XcodeGen spec. Generate the project with:  cd ios && xcodegen generate
# The generated SocialRewind.xcodeproj is gitignored; this file is the source of truth.
name: SocialRewind

options:
  bundleIdPrefix: app.socialrewind
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO

packages:
  RewindCore:
    path: Packages/RewindCore

targets:
  SocialRewind:
    type: application
    platform: iOS
    sources:
      - path: SocialRewind
        excludes:
          - "Resources/Generated/**"
          - "Info.plist"
          - "SocialRewind.entitlements"
      - path: Shared
    dependencies:
      - package: RewindCore
      - target: ShieldConfiguration
      - target: ShieldAction
      - target: DeviceActivityMonitor
    preBuildScripts:
      - name: Build filter engine and copy rule packs
        # Copies engine/dist/social-rewind-{page,isolated}.js and rules/*.json into
        # <App>.app/Generated/. Fails the build if either is missing (fail closed).
        script: |
          "${SRCROOT}/../scripts/build-engine-for-ios.sh"
        basedOnDependencyAnalysis: false
    info:
      path: SocialRewind/Info.plist
      properties:
        CFBundleDisplayName: Social Rewind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SRAppGroupIdentifier: $(SR_APP_GROUP)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - socialrewind
    entitlements:
      path: SocialRewind/SocialRewind.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(SR_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SR_BUNDLE_PREFIX)
        # iPhone only. XcodeGen's per-target default ("1,2") would otherwise override the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: SocialRewind
        # The engine build script reads ../engine and ../rules, so Xcode's script sandbox must be off.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfiguration
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: RewindCore
    info:
      path: Extensions/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: Social Rewind Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SRAppGroupIdentifier: $(SR_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Extensions/ShieldConfiguration/ShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(SR_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SR_BUNDLE_PREFIX).ShieldConfiguration
        TARGETED_DEVICE_FAMILY: "1"

  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: RewindCore
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Social Rewind Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SRAppGroupIdentifier: $(SR_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Extensions/ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(SR_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SR_BUNDLE_PREFIX).ShieldAction
        TARGETED_DEVICE_FAMILY: "1"

  DeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityMonitor
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: RewindCore
    info:
      path: Extensions/DeviceActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: Social Rewind Activity Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SRAppGroupIdentifier: $(SR_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Extensions/DeviceActivityMonitor/DeviceActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(SR_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SR_BUNDLE_PREFIX).DeviceActivityMonitor
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  SocialRewind:
    build:
      targets:
        SocialRewind: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
